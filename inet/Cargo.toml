[package]
edition = "2021"
name = "inet"
version = "0.1.0"

[features]
full = ["dhcp"]

default = []
dhcp = []
libpcap = []
test-util = []

[dependencies]
async-trait = "*"
fxhash = "0.2.1"
des = { version = "*", features = ["full"] }
tokio = "1.37.0"
tracing = { version = "*" }
bytes = "1.4.0"
rand = "*"
types = { path = "../util/types" }
bytepack = { path = "../util/bytepack" }
bitflags = ">2.6.0"

[dev-dependencies]
serial_test = "2.0.0"
pcapng = { path = "../util/pcapng", features = ["test-util"] }
